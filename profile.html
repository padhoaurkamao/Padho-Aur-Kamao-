<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My Profile - Padho Aur Kamao</title><style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f5f7fb;
    color:#172033;
}

a{
    text-decoration:none;
    color:inherit;
}

.topbar{
    height:70px;
    background:white;
    border-bottom:1px solid #e8eaf0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
}

.back-btn{
    padding:10px 16px;
    border-radius:10px;
    background:#f1ebff;
    color:#6526d7;
    font-size:14px;
    font-weight:bold;
}

.logo{
    font-size:18px;
    font-weight:800;
    color:#6526d7;
}

.container{
    max-width:800px;
    margin:35px auto;
    padding:0 18px;
}

.profile-card{
    background:white;
    border:1px solid #edf0f5;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 5px 25px rgba(24,32,77,.06);
}

.profile-header{
    padding:35px 20px;
    text-align:center;
    background:linear-gradient(135deg,#5420bd,#8b5cf6);
    color:white;
}

.profile-photo-box{
    position:relative;
    width:110px;
    height:110px;
    margin:0 auto 15px;
}

.profile-photo{
    width:110px;
    height:110px;
    border-radius:50%;
    border:4px solid white;
    background:#eee;
    object-fit:cover;
}

.default-avatar{
    width:110px;
    height:110px;
    border-radius:50%;
    border:4px solid white;
    background:#ffffff;
    color:#6526d7;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
    font-weight:bold;
}

.photo-label{
    position:absolute;
    right:0;
    bottom:0;
    width:34px;
    height:34px;
    border-radius:50%;
    background:#6526d7;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border:2px solid white;
}

#photoInput{
    display:none;
}

.profile-header h2{
    font-size:24px;
}

.profile-header p{
    margin-top:7px;
    font-size:13px;
    opacity:.9;
}

.profile-body{
    padding:25px;
}

.section-title{
    font-size:18px;
    font-weight:700;
    margin-bottom:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.form-group{
    margin-bottom:5px;
}

.form-group.full{
    grid-column:1/-1;
}

label{
    display:block;
    font-size:12px;
    font-weight:bold;
    color:#687086;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #dfe3eb;
    border-radius:10px;
    outline:none;
    font-size:14px;
}

input:focus{
    border-color:#6526d7;
    box-shadow:0 0 0 3px #f1ebff;
}

input:disabled{
    background:#f5f6f8;
    color:#777;
}

.member-box{
    margin-top:20px;
    padding:16px;
    background:#f7f5ff;
    border-radius:12px;
}

.member-box span{
    display:block;
    font-size:11px;
    color:#777;
}

.member-box strong{
    display:block;
    margin-top:6px;
    font-size:16px;
    color:#6526d7;
}

.save-btn{
    margin-top:25px;
    width:100%;
    padding:14px;
    border:0;
    border-radius:11px;
    background:linear-gradient(135deg,#6526d7,#8b5cf6);
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.save-btn:disabled{
    opacity:.7;
    cursor:not-allowed;
}

.message{
    text-align:center;
    font-size:13px;
    margin-top:14px;
    min-height:18px;
}

.logout-btn{
    margin-top:12px;
    width:100%;
    padding:13px;
    border:1px solid #fecaca;
    border-radius:11px;
    background:#fff;
    color:#dc2626;
    font-weight:bold;
    cursor:pointer;
}

@media(max-width:600px){

    .topbar{
        padding:0 15px;
    }

    .container{
        margin:20px auto;
    }

    .profile-body{
        padding:20px 15px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

}

</style></head><body><header class="topbar"><a href="dashboard.html" class="back-btn">
← Dashboard
</a><div class="logo">
📚 Padho Aur Kamao
</div></header><main class="container"><div class="profile-card"><div class="profile-header"><div class="profile-photo-box"><img
id="profilePhoto"
class="profile-photo"
style="display:none">

<div
id="defaultAvatar"
class="default-avatar">S

</div><label
for="photoInput"
class="photo-label">

📷

</label><input
type="file"
id="photoInput"
accept="image/*">

</div><h2 id="headerName">Student

</h2><p id="headerEmail">student@email.com

</p></div><div class="profile-body"><h3 class="section-title">👤 Personal Information

</h3><div class="form-grid"><div class="form-group"><label>Full Name

</label><input
type="text"
id="nameInput"
placeholder="Enter your name">

</div><div class="form-group"><label>Mobile Number

</label><input
type="tel"
id="phoneInput"
placeholder="Enter mobile number">

</div><div class="form-group full"><label>Email Address

</label><input
type="email"
id="emailInput"
disabled>

</div></div><div class="member-box"><span>MEMBER ID

</span><strong
id="memberId">

Loading...

</strong></div><button
id="saveBtn"
class="save-btn">

💾 Save Profile

</button><p
id="message"
class="message"></p><button
id="logoutBtn"
class="logout-btn">

🚪 Logout

</button></div></div></main><script type="module">


import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {

getAuth,
onAuthStateChanged,
signOut,
updateProfile

}

from

"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {

getFirestore,
doc,
getDoc,
setDoc,
updateDoc

}

from

"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



const firebaseConfig={

apiKey:
"AIzaSyDhYPTmWOqYgUOk3a0QK0WJBFIYlGZdWA0",

authDomain:
"padho-aur-kamao-3eeae.firebaseapp.com",

projectId:
"padho-aur-kamao-3eeae",

storageBucket:
"padho-aur-kamao-3eeae.firebasestorage.app",

messagingSenderId:
"670063905617",

appId:
"1:670063905617:web:9b3a7e62fdeea14fbfa170",

measurementId:
"G-7J1YV8HN3F"

};



const app=
initializeApp(firebaseConfig);


const auth=
getAuth(app);


const db=
getFirestore(app);



const $=
id=>
document.getElementById(id);



let currentUser=null;

let selectedPhoto=null;



onAuthStateChanged(

auth,

async user=>{


if(!user){

location.href=
"login.html";

return;

}


currentUser=user;


await loadProfile();


}

);



async function loadProfile(){

try{


const ref=
doc(
db,
"users",
currentUser.uid
);


const snap=
await getDoc(ref);


let data={};


if(snap.exists()){

data=
snap.data();

}else{


data={

name:
currentUser.displayName||
"Student",

email:
currentUser.email||
"",

phone:
""

};


await setDoc(
ref,
data
);


}



const name=
data.name||
currentUser.displayName||
"Student";


const email=
currentUser.email||
data.email||
"";


$("nameInput").value=
name;


$("phoneInput").value=
data.phone||
"";


$("emailInput").value=
email;


$("headerName").innerText=
name;


$("headerEmail").innerText=
email;


$("memberId").innerText=
currentUser.uid
.substring(0,12);


$("defaultAvatar").innerText=
name
.charAt(0)
.toUpperCase();


if(data.photoURL){


$("profilePhoto").src=
data.photoURL;


$("profilePhoto").style.display=
"block";


$("defaultAvatar").style.display=
"none";


}


}catch(error){


console.log(
"Profile Load Error:",
error
);


}

}



$("photoInput").onchange=

event=>{


const file=
event.target.files[0];


if(!file){

return;

}


if(

file.size>
2*1024*1024

){

$("message").innerText=

"Photo size 2MB से कम रखें।";

return;

}


const reader=
new FileReader();


reader.onload=

e=>{


selectedPhoto=
e.target.result;


$("profilePhoto").src=
selectedPhoto;


$("profilePhoto").style.display=
"block";


$("defaultAvatar").style.display=
"none";


};


reader.readAsDataURL(
file
);


};



$("saveBtn").onclick=

async()=>{


const name=
$("nameInput").value
.trim();


const phone=
$("phoneInput").value
.trim();



if(!name){


$("message").innerText=

"कृपया अपना नाम डालें।";

return;


}



if(

phone &&

! /^[0-9]{10}$/
.test(phone)

){


$("message").innerText=

"कृपया सही 10 digit mobile number डालें।";

return;


}



try{


$("saveBtn").disabled=
true;


$("saveBtn").innerText=

"Saving...";


const updateData={

name:name,

phone:phone

};



if(selectedPhoto){

updateData.photoURL=
selectedPhoto;

}



await setDoc(

doc(
db,
"users",
currentUser.uid
),

updateData,

{

merge:true

}

);



await updateProfile(

currentUser,

{

displayName:name

}

);



$("headerName").innerText=
name;


$("defaultAvatar").innerText=
name
.charAt(0)
.toUpperCase();


$("message").innerText=

"✓ Profile successfully saved!";


}catch(error){


console.log(
"Save Error:",
error
);


$("message").innerText=

"Profile save नहीं हो पाया।";


}finally{


$("saveBtn").disabled=
false;


$("saveBtn").innerText=

"💾 Save Profile";


}


};



$("logoutBtn").onclick=

async()=>{


try{


await signOut(auth);


location.href=
"login.html";


}catch(error){


$("message").innerText=

"Logout नहीं हो पाया।";


}


};


</script></body></html>
