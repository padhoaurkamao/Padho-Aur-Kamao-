<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Course - Padho Aur Kamao</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f4f7fb;
}
header{
  background:#2563eb;
  color:white;
  padding:18px;
}
main{
  max-width:900px;
  margin:auto;
  padding:20px;
}
.box{
  background:white;
  padding:20px;
  border-radius:15px;
  margin-bottom:15px;
  box-shadow:0 3px 10px #0001;
}
.lesson{
  padding:15px;
  border:1px solid #ddd;
  border-radius:10px;
  margin:10px 0;
}
</style>
</head>

<body>

<header>
  📚 Padho Aur Kamao
</header>

<main>

<div id="content" class="box">
  Course loading...
</div>

</main>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
 getAuth,
 onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
 getFirestore,
 doc,
 getDoc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

 apiKey:"YOUR_API_KEY",

 authDomain:
 "YOUR_PROJECT.firebaseapp.com",

 projectId:
 "YOUR_PROJECT_ID",

 storageBucket:
 "YOUR_PROJECT.firebasestorage.app",

 messagingSenderId:
 "YOUR_SENDER_ID",

 appId:
 "YOUR_APP_ID"
};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


const params =
new URLSearchParams(
window.location.search
);

const courseId =
params.get("id");


onAuthStateChanged(
auth,
async(user)=>{

 if(!user){

   location.href="login.html";

   return;
 }


 if(!courseId){

   document.getElementById("content")
   .innerHTML=
   "<h2>Course ID missing</h2>";

   return;
 }


 const enrollmentId =
 user.uid + "_" + courseId;


 const enrollmentSnap =
 await getDoc(
   doc(
     db,
     "enrollments",
     enrollmentId
   )
 );


 if(
   !enrollmentSnap.exists() ||
   enrollmentSnap.data().status !== "active"
 ){

   document.getElementById("content")
   .innerHTML=`
     <h2>🔒 Access Denied</h2>
     <p>
       आपने यह course purchase नहीं किया है।
     </p>
   `;

   return;
 }


 const courseSnap =
 await getDoc(
   doc(
     db,
     "courses",
     courseId
   )
 );


 if(!courseSnap.exists()){

   document.getElementById("content")
   .innerHTML=
   "<h2>Course नहीं मिला</h2>";

   return;
 }


 const course =
 courseSnap.data();


 document.getElementById("content")
 .innerHTML=`

   <h1>
     🎓 ${escapeHTML(course.title)}
   </h1>

   <p>
     ${escapeHTML(
       course.description || ""
     )}
   </p>

   <hr>

   <h2>📖 Lessons</h2>

   <div class="lesson">
     Lesson 1 — Introduction
   </div>

   <div class="lesson">
     Lesson 2 — Basic Concepts
   </div>

   <div class="lesson">
     Lesson 3 — Practice
   </div>

   <div class="lesson">
     Lesson 4 — Final Test
   </div>

 `;

});


function escapeHTML(value){

 return String(value)
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");

}

</script>

</body>
</html>
