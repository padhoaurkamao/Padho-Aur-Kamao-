<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login - Padho Aur Kamao</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
}
.box{
  max-width:420px;
  margin:60px auto;
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:0 5px 25px #0002;
}
h1{
  text-align:center;
  color:#5b21b6;
}
input{
  width:100%;
  padding:13px;
  margin:8px 0 15px;
  border:1px solid #ddd;
  border-radius:8px;
  box-sizing:border-box;
}
button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:9px;
  background:#6d28d9;
  color:white;
  font-weight:bold;
  cursor:pointer;
  margin-top:8px;
}
.google{
  background:#111827;
}
.message{
  margin-top:15px;
  text-align:center;
}
.home{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#5b21b6;
}
</style>
</head>

<body>

<div class="box">

<h1>📚 Padho Aur Kamao</h1>

<h2 id="title">Create Account</h2>

<input
  id="name"
  type="text"
  placeholder="आपका नाम">

<input
  id="email"
  type="email"
  placeholder="Email">

<input
  id="password"
  type="password"
  placeholder="Password">

<button onclick="signup()">
  Create Account
</button>

<button onclick="login()">
  Login
</button>

<button class="google" onclick="googleLogin()">
  Continue with Google
</button>

<p class="message" id="message"></p>

<a class="home" href="index.html">
  ← Home पर जाएँ
</a>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup,
  updateProfile
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
  "AIzaSyDhYPTmWOqYgUOk3a0QK0WJBFIYlGZdWA0",

  authDomain:
  "padho-aur-kamao-3eeae.firebaseapp.com",

  projectId:
  "padho-aur-kamao-3eeae",

  storageBucket:
  "padho-aur-kamao-3eeae.firebasestorage.app",

  messagingSenderId:
  "670063905617",

  appId:
  "1:670063905617:web:9b3a7e62fdeea14fbfa170",

  measurementId:
  "G-7J1YV8HN3F"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


const message =
document.getElementById("message");


/* SIGNUP */

window.signup = async function(){

  const name =
  document.getElementById("name").value.trim();

  const email =
  document.getElementById("email").value.trim();

  const password =
  document.getElementById("password").value;


  if(!name || !email || !password){

    message.innerText =
    "⚠️ सभी fields भरें।";

    return;

  }


  if(password.length < 6){

    message.innerText =
    "⚠️ Password कम से कम 6 characters का रखें।";

    return;

  }


  try{

    const result =
    await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );


    await updateProfile(
      result.user,
      {
        displayName:name
      }
    );


    await setDoc(
      doc(db,"users",result.user.uid),
      {
        name:name,
        email:email,
        enrolledCourses:[],
        createdAt:new Date().toISOString()
      }
    );


    message.innerText =
    "✅ Account बन गया! Dashboard खुल रहा है...";


    setTimeout(function(){

      window.location.href =
      "dashboard.html";

    },1000);


  }catch(error){

    message.innerText =
    "❌ " + error.message;

  }

};


/* LOGIN */

window.login = async function(){

  const email =
  document.getElementById("email").value.trim();

  const password =
  document.getElementById("password").value;


  if(!email || !password){

    message.innerText =
    "⚠️ Email और Password भरें।";

    return;

  }


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );


    message.innerText =
    "✅ Login successful!";


    setTimeout(function(){

      window.location.href =
      "dashboard.html";

    },700);


  }catch(error){

    message.innerText =
    "❌ Email या Password गलत है।";

  }

};


/* GOOGLE LOGIN */

window.googleLogin = async function(){

  try{

    const provider =
    new GoogleAuthProvider();

    const result =
    await signInWithPopup(
      auth,
      provider
    );


    await setDoc(
      doc(db,"users",result.user.uid),
      {
        name:
        result.user.displayName || "",

        email:
        result.user.email || "",

        enrolledCourses:[],

        updatedAt:
        new Date().toISOString()
      },
      {
        merge:true
      }
    );


    window.location.href =
    "dashboard.html";


  }catch(error){

    message.innerText =
    "❌ Google Login नहीं हो पाया।";

  }

};

</script>

</body>
</html>
