<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Padho Aur Kamao - Affiliate Marketing</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f7fb;
 color:#172033
}
header{
 background:linear-gradient(135deg,#4f46e5,#7c3aed);
 color:#fff;
 padding:18px 14px;
 position:sticky;
 top:0;
 z-index:10
}
.head{
 max-width:1100px;
 margin:auto;
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px
}
.logo{font-size:22px;font-weight:800}
.small{font-size:12px;opacity:.9}
nav{
 max-width:1100px;
 margin:14px auto 0;
 display:flex;
 gap:7px;
 overflow-x:auto
}
nav button{
 border:0;
 background:#ffffff22;
 color:white;
 padding:10px 13px;
 border-radius:10px;
 white-space:nowrap
}
main{max-width:1100px;margin:auto;padding:20px 14px 50px}
.page{display:none}
.page.active{display:block}
.hero{
 background:#fff;
 padding:30px;
 border-radius:20px;
 box-shadow:0 5px 20px #0000000b
}
.hero h1{font-size:30px;margin-top:0}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
 gap:16px;
 margin-top:18px
}
.card{
 background:#fff;
 padding:18px;
 border-radius:16px;
 box-shadow:0 4px 16px #0000000a
}
.price{font-size:26px;font-weight:800;margin:12px 0}
.btn{
 border:0;
 border-radius:10px;
 padding:11px 15px;
 background:#4f46e5;
 color:#fff;
 font-weight:700;
 cursor:pointer
}
.btn.red{background:#dc2626}
.btn.light{background:#eef2ff;color:#4338ca}
input,textarea,select{
 width:100%;
 padding:11px;
 margin:6px 0 12px;
 border:1px solid #d7dce5;
 border-radius:10px;
 font-size:15px
}
textarea{min-height:90px}
.row{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px
}
.video{
 width:100%;
 height:210px;
 border:0;
 border-radius:12px;
 background:#111
}
.lesson{
 padding:14px;
 border-top:1px solid #eee
}
.badge{
 display:inline-block;
 padding:5px 9px;
 border-radius:20px;
 background:#dcfce7;
 color:#166534;
 font-size:12px;
 font-weight:bold
}
.stat{font-size:28px;font-weight:800}
.muted{color:#687386;font-size:14px}
.notice{
 margin-top:15px;
 padding:13px;
 background:#fff7ed;
 color:#9a3412;
 border-radius:10px;
 font-size:13px
}
footer{
 text-align:center;
 padding:25px;
 color:#687386
}
@media(max-width:600px){
 .head{flex-direction:column;align-items:flex-start}
 .row{grid-template-columns:1fr}
 .hero h1{font-size:25px}
}
</style>
</head>

<body>

<header>
<div class="head">
<div>
<div class="logo">📚 Padho Aur Kamao</div>
<div class="small
