<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Padho Aur Kamao</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f7fb;
  color:#172033;
}

header{
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
  color:white;
  padding:22px 16px;
  border-radius:0 0 25px 25px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.menu{
  font-size:25px;
}

.hero{
  padding:25px 0 10px;
}

.hero h1{
  font-size:30px;
  margin-bottom:8px;
}

.hero p{
  opacity:.9;
  line-height:1.5;
}

.container{
  width:94%;
  max-width:900px;
  margin:auto;
}

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-top:18px;
}

.stat{
  background:white;
  padding:18px;
  border-radius:16px;
  box-shadow:0 4px 15px #00000012;
}

.stat small{
  color:#777;
}

.stat h2{
  margin-top:7px;
  color:#4f46e5;
}

.section{
  margin-top:25px;
}

.section h2{
  margin-bottom:14px;
}

.card{
  background:white;
  padding:18px;
  border-radius:18px;
  margin-bottom:14px;
  box-shadow:0 4px 15px #00000010;
}

.card h3{
  margin-bottom:8px;
}

.card p{
  color:#666;
  line-height:1.5;
}

.btn{
  display:inline-block;
  margin-top:12px;
  padding:11px 18px;
  border-radius:10px;
  background:#4f46e5;
  color:white;
  text-decoration:none;
  border:0;
  cursor:pointer;
  font-weight:bold;
}

.btn.green{
  background:#16a34a;
}

.btn.orange{
  background:#ea580c;
}

.course-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.course{
  background:white;
  padding:17px;
  border-radius:16px;
  box-shadow:0 4px 15px #0000000d;
}

.course-icon{
  font-size:32px;
  margin-bottom:8px;
}

.progress{
  height:8px;
  background:#e5e7eb;
  border-radius:10px;
  margin-top:12px;
  overflow:hidden;
}

.progress div{
  height:100%;
  background:#4f46e5;
}

.product{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
}

.rank{
  display:flex;
  justify-content:space-between;
  padding:14px;
  border-bottom:1px solid #eee;
}

.rank:last-child{
  border-bottom:0;
}

.referral{
  background:linear-gradient(135deg,#111827,#312e81);
  color:white;
  padding:22px;
  border-radius:20px;
}

.referral input{
  width:100%;
  padding:12px;
  margin-top:12px;
  border:0;
  border-radius:9px;
}

nav{
  position:sticky;
  bottom:0;
  background:white;
  display:flex;
  justify-content:space-around;
  padding:12px 5px;
  box-shadow:0 -3px 15px #00000015;
  margin-top:30px;
}

nav a{
  text-decoration:none;
  color:#555;
  text-align:center;
  font-size:12px;
}

nav span{
  display:block;
  font-size:21px;
  margin-bottom:3px;
}

footer{
  text-align:center;
  padding:25px;
  color:#777;
}

@media(max-width:500px){
  .course-grid{
    grid-template-columns:1fr 1fr;
  }

  .hero h1{
    font-size:26px;
  }
}
</style>
</head>

<body>

<header>
  <div class="container">

    <div class="top">
      <div class="logo">📚 Padho Aur Kamao</div>
      <div class="menu">☰</div>
    </div>

    <div class="hero">
      <h1>पढ़ो भी, कमाओ भी 🚀</h1>
      <p>
        Skills सीखें, courses complete करें और affiliate opportunities
        के बारे में जानें।
      </p>
    </div>

  </div>
</header>

<main class="container">

  <!-- Dashboard -->

  <section class="stats">

    <div class="stat">
      <small>आज की Earning</small>
      <h2>₹250</h2>
    </div>

    <div class="stat">
      <small>इस Week</small>
      <h2>₹1,750
