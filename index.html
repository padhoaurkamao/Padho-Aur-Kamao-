
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Padho Aur Kamao</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7ff;
  color:#172033;
}

header{
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
  color:white;
  padding:18px 20px;
  position:sticky;
  top:0;
  z-index:10;
}

.nav{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.login-btn{
  background:white;
  color:#5b21b6;
  padding:10px 18px;
  border-radius:25px;
  text-decoration:none;
  font-weight:bold;
}

.hero{
  max-width:1100px;
  margin:auto;
  padding:55px 20px;
  text-align:center;
}

.hero h1{
  font-size:42px;
  margin:10px 0;
}

.hero p{
  font-size:18px;
  color:#5f6778;
}

.start-btn{
  display:inline-block;
  margin-top:20px;
  background:#6d28d9;
  color:white;
  padding:14px 25px;
  border-radius:10px;
  text-decoration:none;
  font-weight:bold;
}

.section{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.section h2{
  text-align:center;
  margin-bottom:25px;
}

.courses{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.course{
  background:white;
  border-radius:18px;
  padding:22px;
  box-shadow:0 5px 20px #0001;
  transition:.2s;
}

.course:hover{
  transform:translateY(-4px);
}

.icon{
  font-size:45px;
}

.course h3{
  margin:12px 0 8px;
}

.course p{
  color:#687083;
  line-height:1.5;
}

.course-btn{
  display:block;
  text-align:center;
  background:#eef2ff;
  color:#4f46e5;
  padding:11px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
  margin-top:15px;
}

.features{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
  margin-top:30px;
}

.feature{
  background:white;
  padding:20px;
  border-radius:15px;
  text-align:center;
  box-shadow:0 3px 15px #0001;
}

footer{
  margin-top:50px;
  background:#111827;
  color:white;
  text-align:center;
  padding:25px 15px;
}

.referral-message{
  display:none;
  max-width:700px;
  margin:20px auto 0;
  padding:14px 18px;
  background:#ecfdf5;
  color:#166534;
  border:1px solid #bbf7d0;
  border-radius:12px;
  font-weight:bold;
}

@media(max-width:550px){

  .hero{
    padding:40px 15px;
  }

  .hero h1{
    font-size:30px;
  }

  .hero p{
    font-size:16px;
  }

  .logo{
    font-size:18px;
  }

  .login-btn{
    padding:8px 12px;
    font-size:13px;
  }

}
</style>
</head>

<body>

<header>

  <div class="nav">

    <div class="logo">
      📚 Padho Aur Kamao
    </div>

    <a
      class="login-btn"
      href="login.html"
      id="loginBtn">

      Login / Signup

    </a>

  </div>

</header>


<section class="hero">

  <h1>
    Padho Aur Kamao 🚀
  </h1>

  <p>
    सीखें • Skill बढ़ाएँ • अपने ज्ञान का सही उपयोग करें
  </p>

  <div
    id="referralMessage"
    class="referral-message">

    🎉 Referral Link से आपका स्वागत है!

  </div>

  <a
    class="start-btn"
    href="login.html"
    id="startBtn">

    शुरू करें →

  </a>

</section>


<section class="section">

  <h2>
    🎓 हमारे Courses
  </h2>

  <div class="courses">


    <!-- COURSE 1 -->

    <div class="course">

      <div class="icon">
        🚀
      </div>

      <h3>
        Step To Success
      </h3>

      <p>
