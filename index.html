<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Padho Aur Kamao</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f6fb;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}


/* LOADING SCREEN */

.loader-box{
    text-align:center;
    padding:30px;
}


.logo{
    width:75px;
    height:75px;

    margin:0 auto 18px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:22px;

    font-size:35px;

    color:white;

    background:
    linear-gradient(
        135deg,
        #4f46e5,
        #9333ea
    );

    box-shadow:
    0 15px 35px
    rgba(79,70,229,.25);
}


h1{
    font-size:26px;
    color:#111827;
    margin-bottom:8px;
}


p{
    color:#64748b;
    font-size:14px;
}


.spinner{

    width:35px;
    height:35px;

    margin:22px auto 0;

    border:4px solid #e5e7eb;

    border-top-color:#6d28d9;

    border-radius:50%;

    animation:spin .8s linear infinite;

}


@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}

</style>

</head>


<body>


<div class="loader-box">


    <div class="logo">
        📚
    </div>


    <h1>
        Padho Aur Kamao
    </h1>


    <p>
        Courses Packages Loading...
    </p>


    <div class="spinner">
    </div>


</div>



<script>

/* =========================
   OPEN COURSES PAGE
========================= */

window.location.replace(
    "courses.html"
);

</script>


</body>

</html>
