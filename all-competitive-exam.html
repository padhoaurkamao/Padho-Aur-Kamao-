<script>

/* =========================
SECTION SWITCH
========================= */

function showSection(id,button){

document.querySelectorAll(".exam-section")
.forEach(function(section){
section.classList.remove("active");
});

document.getElementById(id)
.classList.add("active");

document.querySelectorAll(".main-tab")
.forEach(function(btn){
btn.classList.remove("active");
});

button.classList.add("active");

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* =========================
SUBJECT OPEN/CLOSE
========================= */

function toggleSubject(id){

const box =
document.getElementById(id);

box.classList.toggle("open");

}


/* =========================
VIDEO LINKS
========================= */

const videos = {

/* GS VIDEOS */

"Ancient History":
"https://www.youtube.com/embed/Vp0OZroGDpA",

"Medieval History":
"https://www.youtube.com/embed/ODPcedfOLd0",

"Modern History":
"https://www.youtube.com/embed/lrYbQopVuPY",

"Indian Geography":
"https://www.youtube.com/embed/g_MiJXGnMaY",

"World Geography":
"https://www.youtube.com/embed/OwVLEE4o058",

"Indian Polity":
"https://www.youtube.com/embed/eSX7VeLFnks",

"Indian Economy":
"https://www.youtube.com/embed/svxbMRVsfdw",

"Environment":
"https://www.youtube.com/embed/Aj8DHlGpICk",

"Art and Culture":
"https://www.youtube.com/embed/nLU2f3pfCs8",


/* SCIENCE VIDEOS */

"Physics":
"https://www.youtube.com/embed/jSSLwEp_nGI",

"Chemistry":
"https://www.youtube.com/embed/GPrTd_MvFg0",

"Biology":
"https://www.youtube.com/embed/U0vd15zoNQE"

};


/* =========================
OPEN VIDEO
========================= */

function openVideo(chapter){

const area =
document.getElementById("videoArea");

const videoUrl =
videos[chapter];

if(videoUrl){

area.innerHTML = `

<h3>🎬 ${chapter}</h3>

<div class="video-box">

<iframe
src="${videoUrl}"
title="${chapter}"
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
allowfullscreen>
</iframe>

</div>

`;

}else{

area.innerHTML = `

<div style="font-size:45px;">
🎥
</div>

<h3>${chapter}</h3>

<p>
इस chapter का video अभी उपलब्ध नहीं है।
</p>

`;

}

area.scrollIntoView({
behavior:"smooth"
});

}


/* =========================
CREATE CHAPTERS
========================= */

function createChapters(containerId,chapters){

const container =
document.getElementById(containerId);

chapters.forEach(function(chapter){

const div =
document.createElement("div");

div.className="chapter";

div.innerHTML = `

<div class="chapter-name">
${chapter}
</div>

<button
class="video-btn"
onclick="openVideo('${chapter.replace(/'/g,"\\'")}')">

🎥 Video

</button>

`;

container.appendChild(div);

});

}
