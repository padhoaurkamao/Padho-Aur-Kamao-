<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Padho Aur Kamao</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f4f7fb;
 color:#172033;
}
header{
 background:linear-gradient(135deg,#5b21b6,#7c3aed);
 color:#fff;
 padding:15px;
 position:sticky;
 top:0;
 z-index:100;
}
.header{
 max-width:1150px;
 margin:auto;
 display:flex;
 align-items:center;
 justify-content:space-between;
}
.header-left{
 display:flex;
 align-items:center;
 gap:12px;
}
.logo{
 font-size:20px;
 font-weight:bold;
}
.menu-btn{
 border:0;
 background:#ffffff22;
 color:#fff;
 border-radius:10px;
 padding:8px 12px;
 font-size:20px;
 cursor:pointer;
}
.logout{
 border:0;
 background:#fff;
 color:#5b21b6;
 padding:9px 14px;
 border-radius:20px;
 font-weight:bold;
 cursor:pointer;
}
.container{
 max-width:1150px;
 margin:auto;
 padding:22px 16px 100px;
}
.welcome{
 background:linear-gradient(135deg,#5b21b6,#8b5cf6);
 color:#fff;
 padding:25px;
 border-radius:22px;
 margin-bottom:20px;
}
.welcome h1{
 margin:0 0 7px;
 font-size:28px;
}
.stats{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:12px;
 margin-bottom:25px;
}
.stat{
 background:#fff;
 padding:17px;
 border-radius:18px;
 box-shadow:0 5px 20px #0001;
}
.stat-icon{font-size:26px}
.stat-title{
 color:#6b7280;
 font-size:13px;
 margin-top:7px;
}
.stat-value{
 font-size:22px;
 font-weight:bold;
 margin-top:5px;
}
.section-title{
 font-size:21px;
 margin:27px 0 14px;
}
.actions{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:13px;
}
.action{
 background:#fff;
 padding:18px;
 border-radius:18px;
 box-shadow:0 5px 20px #0001;
 text-decoration:none;
 color:#172033;
}
.action-icon{font-size:30px}
.action h3{margin:8px 0 4px}
.action p{
 margin:0;
 color:#6b7280;
 font-size:13px;
}
.courses{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:18px;
}
.course{
 background:#fff;
 border-radius:20px;
 overflow:hidden;
 box-shadow:0 5px 20px #0001;
}
.course-icon{
 height:145px;
 background:linear-gradient(135deg,#1d4ed8,#7c3aed);
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:65px;
}
.course-content{padding:20px}
.course h3{
 margin:0 0 7px;
 font-size:21px;
}
.course p{
 color:#6b7280;
 font-size:14px;
 line-height:1.5;
}
.course-details{line-height:1.9}
.price{
 font-weight:bold;
 font-size:17px;
}
.commission{
 color:#16a34a;
 font-weight:bold;
}
.passive{
 color:#7c3aed;
 font-weight:bold;
}
.course-btn{
 display:block;
 width:100%;
 border:0;
 background:#6d28d9;
 color:#fff;
 padding:12px;
 border-radius:10px;
 font-weight:bold;
 cursor:pointer;
 text-align:center;
 text-decoration:none;
 margin-top:15px;
}
.profile,
.referral,
.feature-box{
 background:#fff;
 padding:20px;
 border-radius:18px;
 box-shadow:0 5px 20px #0001;
}
.profile-row{
 display:flex;
 justify-content:space-between;
 padding:12px 0;
 border-bottom:1px solid #eee;
 gap:15px;
}
.label{color:#6b7280}
.referral-box{
 display:flex;
 gap:8px;
}
.referral-box input{
 flex:1;
 padding:12px;
 border:1px solid #d1d5db;
 border-radius:10px;
}
.copy-btn{
 border:0;
 background:#6d28d9;
 color:#fff;
 border-radius:10px;
 padding:0 18px;
 font-weight:bold;
 cursor:pointer;
}
.referral-stats{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px;
 margin-top:15px;
}
.ref-card{
 background:#f5f3ff;
 padding:13px;
 border-radius:12px;
 text-align:center;
}
.ref-card strong{
 display:block;
 color:#6d28d9;
 font-size:21px;
 margin-top:4px;
}
.hidden{display:none!important}

/* SIDE MENU */
.drawer-backdrop{
 display:none;
 position:fixed;
 inset:0;
 background:#0007;
 z-index:500;
}
.drawer-backdrop.show{display:block}
