<!DOCTYPE html>
<html lang="hi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Dashboard - Padho Aur Kamao</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#111827;
}

header{
  background:linear-gradient(135deg,#5b21b6,#7c3aed);
  color:white;
  padding:16px 20px;
  position:sticky;
  top:0;
  z-index:10;
}

.header{
  max-width:1150px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.header-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.settings-btn{
  border:0;
  background:white;
  color:#5b21b6;
  padding:10px 13px;
  border-radius:10px;
  font-size:18px;
  cursor:pointer;
}

.menu-btn{
  display:none;
  border:0;
  background:white;
  color:#5b21b6;
  padding:10px;
  border-radius:10px;
  font-size:20px;
}

.layout{
  max-width:1150px;
  margin:auto;
  display:flex;
  min-height:calc(100vh - 70px);
}

.sidebar{
  width:230px;
  background:white;
  padding:20px 12px;
  border-right:1px solid #e5e7eb;
}

.nav{
  display:block;
  padding:13px;
  margin:5px 0;
  border-radius:10px;
  color:#374151;
  text-decoration:none;
  cursor:pointer;
}

.nav:hover,
.nav.active{
  background:#ede9fe;
  color:#5b21b6;
  font-weight:bold;
}

.main{
  flex:1;
  padding:25px;
}

.welcome{
  background:white;
  border-radius:18px;
  padding:23px;
  box-shadow:0 5px 20px #0001;
  margin-bottom:20px;
}

.welcome h1{
  margin:0 0 7px;
}

.muted{
  color:#6b7280;
}


/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:25px;
}

.stat{
  background:white;
  padding:18px;
  border-radius:15px;
  box-shadow:0 4px 15px #0001;
}

.stat-icon{
  font-size:25px;
}

.stat-number{
  font-size:23px;
  font-weight:bold;
  margin-top:7px;
}

.stat-label{
  color:#6b7280;
  font-size:13px;
}


/* COURSES */

.section-title{
  margin:25px 0 15px;
}

.course{
  background:white;
  padding:22px;
  border-radius:18px;
  margin-bottom:20px;
  box-shadow:0 5px 20px #0001;
}

.course-header{
  display:flex;
  gap:15px;
  align-items:center;
}

.course-icon{
  width:58px;
  height:58px;
  border-radius:15px;
  background:#ede9fe;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  flex-shrink:0;
}

.course h2{
  margin:0 0 6px;
}

.description{
  color:#6b7280;
  line-height:1.5;
}
