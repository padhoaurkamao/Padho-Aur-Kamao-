
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Coupon - Padho Aur Kamao</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,Helvetica,sans-serif;
background:linear-gradient(135deg,#f3f0ff,#eef2ff);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
color:#172033;
}

.container{
width:100%;
max-width:500px;
background:white;
border-radius:25px;
padding:30px;
box-shadow:0 20px 60px rgba(0,0,0,.15);
}

.logo{
text-align:center;
font-size:24px;
font-weight:800;
color:#6526d7;
margin-bottom:25px;
}

h1{
font-size:26px;
margin-bottom:8px;
}

.subtitle{
color:#64748b;
margin-bottom:25px;
}

.course-box{
background:#f5f3ff;
padding:18px;
border-radius:15px;
margin-bottom:22px;
}

.course-name{
font-size:18px;
font-weight:bold;
margin-bottom:8px;
}

.course-price{
font-size:24px;
font-weight:bold;
color:#6526d7;
}

label{
display:block;
font-weight:bold;
margin-bottom:8px;
}

.coupon-row{
display:flex;
gap:10px;
}

input{
flex:1;
padding:14px;
border:1px solid #d1d5db;
border-radius:10px;
font-size:16px;
text-transform:uppercase;
outline:none;
}

input:focus{
border-color:#6526d7;
}

.apply-btn{
border:0;
padding:14px 18px;
background:#6526d7;
color:white;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

.message{
min-height:25px;
margin-top:12px;
font-weight:bold;
font-size:14px;
}

.price-box{
margin-top:20px;
background:#f8fafc;
padding:18px;
border-radius:15px;
}

.row{
display:flex;
justify-content:space-between;
padding:10px 0;
color:#475569;
}

.final{
border-top:1px solid #dbe2ea;
font-size:20px;
font-weight:bold;
color:#172033;
margin-top:8px;
padding-top:15px;
}

.pay-btn{
width:100%;
margin-top:22px;
padding:17px;
border:0;
border-radius:12px;
background:linear-gradient(135deg,#ec00a7,#8b5cf6);
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

.pay-btn:disabled{
opacity:.6;
cursor:not-allowed;
}

.back{
display:block;
text-align:center;
margin-top:18px;
color:#6526d7;
font-weight:bold;
text-decoration:none;
}

@media(max-width:500px){
.container{padding:22px}
.coupon-row{flex-direction:column}
.apply-btn{width:100%}
}
</style>
</head>

<body>

<div class="container">

<div class="logo">📚 Padho Aur Kamao</div>

<h1>🎁 Apply Coupon</h1>

<p class="subtitle">Coupon code लगाकर अपना Discount प्राप्त करें।</p>

<div class="course-box">
<div class="course-name" id="courseName">Loading...</div>
<div class="course-price" id="coursePrice">₹0</div>
</div>

<label>Coupon Code</label>

<div class="coupon-row">
<input type="text" id="couponCode" placeholder="Enter Coupon Code">

<button class="apply-btn" onclick="applyCoupon()">
Apply
</button>
</div>

<div class="message" id="couponMessage"></div>

<div class="price-box">

<div class="row">
<span>Original Price</span>
<strong id="originalPrice">₹0</strong>
</div>

<div class="row">
<span>Discount</span>
<strong id="discountPrice">₹0</strong>
</div>

<div class="row final">
<span>Payable Amount</span>
<strong id="finalPrice">₹0</strong>
</div>

</div>

<button class="pay-btn" id="payBtn" onclick="proceedPayment()">
Proceed to Payment
</button>

<a href="course.html" class="back">
← Back to Courses
</a>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
setDoc,
updateDoc,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig={

apiKey:"AIzaSyDhYPTmWOqYgUOk3a0QK0WJBFIYlGZdWA0",

authDomain:"padho-aur-kamao-3eeae.firebaseapp.com",

projectId:"padho-aur-kamao-3eeae",

storageBucket:"padho-aur-kamao-3eeae.firebasestorage.app",

messagingSenderId:"670063905617",

appId:"1:670063905617:web:9b3a7e62fdeea14fbfa170"

};


const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);


let currentUser=null;

let courseId="";
let courseName="";
let originalPrice=0;
let finalPrice=0;
let couponApplied=false;


const params=new URLSearchParams(window.location.search);

courseId=params.get("course");

courseName=params.get("name");

originalPrice=Number(params.get("price")) || 0;

finalPrice=originalPrice;


document.getElementById("courseName").textContent=
courseName || "Course";

document.getElementById("coursePrice").textContent=
"₹"+originalPrice;

document.getElementById("originalPrice").textContent=
"₹"+originalPrice;

document.getElementById("finalPrice").textContent=
"₹"+originalPrice;


onAuthStateChanged(auth,user=>{

if(!user){

const currentUrl=
window.location.pathname+
window.location.search;

window.location.href=
"login.html?redirect="+
encodeURIComponent(currentUrl);

return;

}

currentUser=user;

});


window.applyCoupon=function(){

const code=document
.getElementById("couponCode")
.value
.trim()
.toUpperCase();

const message=
document.getElementById("couponMessage");


if(code==="FREE100"){

couponApplied=true;

finalPrice=0;

document.getElementById("discountPrice").textContent=
"-₹"+originalPrice;

document.getElementById("finalPrice").textContent=
"₹0";

message.textContent=
"🎉 FREE100 Coupon Successfully Applied!";

message.style.color="#16a34a";

document.getElementById("payBtn").textContent=
"🎉 Get Course Free";

}

else if(code===""){

couponApplied=false;

finalPrice=originalPrice;

document.getElementById("discountPrice").textContent="₹0";

document.getElementById("finalPrice").textContent=
"₹"+originalPrice;

message.textContent=
"कृपया Coupon Code डालें।";

message.style.color="#dc2626";

}

else{

couponApplied=false;

finalPrice=originalPrice;

document.getElementById("discountPrice").textContent=
"₹0";

document.getElementById("finalPrice").textContent=
"₹"+originalPrice;

message.textContent=
"❌ Invalid Coupon Code";

message.style.color="#dc2626";

}

};


async function ensureUserDocument(){

const userRef=
doc(db,"users",currentUser.uid);

const snap=
await getDoc(userRef);

if(!snap.exists()){

await setDoc(userRef,{

name:
currentUser.displayName ||
currentUser.email.split("@")[0],

email:currentUser.email,

totalReferrals:0,

totalCommission:0,

availableBalance:0,

referralActive:false,

kycStatus:"not_started",

createdAt:serverTimestamp()

});

}

return userRef;

}


window.proceedPayment=async function(){

if(!currentUser){

alert("पहले Login करें।");

return;

}


if(finalPrice===0){

const button=
document.getElementById("payBtn");

button.disabled=true;

button.textContent=
"Activating Course...";


try{

const userRef=
await ensureUserDocument();


const courseRef=
doc(
db,
"users",
currentUser.uid,
"courses",
courseId
);


await setDoc(courseRef,{

courseId:courseId,

courseName:courseName,

originalPrice:originalPrice,

paidAmount:0,

paymentStatus:"free",

couponCode:
document.getElementById("couponCode")
.value
.trim()
.toUpperCase(),

status:"active",

enrolledAt:serverTimestamp()

},

{merge:true});


await updateDoc(userRef,{

referralActive:true,

referralActivatedAt:serverTimestamp()

});


window.location.href=
"payment-success.html?course="+
encodeURIComponent(courseName);

}

catch(error){

console.error(error);

alert("Course Activate नहीं हो पाया।");

button.disabled=false;

button.textContent=
"🎉 Get Course Free";

}

return;

}


/* PAID COURSE */

localStorage.setItem(
"pendingCourseId",
courseId
);

localStorage.setItem(
"pendingCourseName",
courseName
);

localStorage.setItem(
"pendingCoursePrice",
finalPrice
);


window.location.href=
"payment.html?course="+
encodeURIComponent(courseId)+
"&name="+
encodeURIComponent(courseName)+
"&price="+
encodeURIComponent(finalPrice);

};

</script>

</body>
</html>
