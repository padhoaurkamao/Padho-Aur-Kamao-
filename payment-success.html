<!DOCTYPE html><html lang="hi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Payment Successful - Padho Aur Kamao</title><style>

/* =========================
   GLOBAL
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,Helvetica,sans-serif;

  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  background:
  linear-gradient(
    135deg,
    #eef2ff,
    #fdf4ff,
    #ecfdf5
  );

  color:#172033;
}


/* =========================
   SUCCESS CARD
========================= */

.success-card{

  width:100%;
  max-width:520px;

  background:white;

  border-radius:28px;

  padding:40px 30px;

  text-align:center;

  box-shadow:
  0 25px 70px
  rgba(15,23,42,.15);

  border:
  1px solid
  rgba(255,255,255,.8);

  animation:
  cardAnimation
  .5s ease;

}


@keyframes cardAnimation{

  from{
    opacity:0;

    transform:
    translateY(30px)
    scale(.96);
  }

  to{
    opacity:1;

    transform:
    translateY(0)
    scale(1);
  }

}


/* =========================
   SUCCESS ICON
========================= */

.success-icon{

  width:90px;
  height:90px;

  margin:
  0 auto
  25px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:48px;

  background:
  linear-gradient(
    135deg,
    #22c55e,
    #16a34a
  );

  color:white;

  box-shadow:
  0 15px 30px
  rgba(34,197,94,.3);

  animation:
  successPop
  .6s ease;

}


@keyframes successPop{

  0%{

    transform:
    scale(0);

  }

  70%{

    transform:
    scale(1.15);

  }

  100%{

    transform:
    scale(1);

  }

}


/* =========================
   TEXT
========================= */

.success-title{

  font-size:32px;

  font-weight:800;

  margin-bottom:12px;

  color:#166534;

}


.success-message{

  color:#64748b;

  font-size:15px;

  line-height:1.6;

  margin-bottom:28px;

}


/* =========================
   PAYMENT DETAILS
========================= */

.payment-details{

  background:#f8fafc;

  border-radius:18px;

  padding:20px;

  text-align:left;

  margin-bottom:25px;

}


.detail-row{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:15px;

  padding:13px 0;

  border-bottom:
  1px solid #e5e7eb;

  font-size:14px;

}


.detail-row:last-child{

  border-bottom:none;

}


.detail-label{

  color:#64748b;

}


.detail-value{

  font-weight:bold;

  color:#172033;

  text-align:right;

}


.payment-status{

  display:inline-block;

  padding:
  7px 12px;

  border-radius:20px;

  background:#dcfce7;

  color:#166534;

  font-size:12px;

  font-weight:bold;

}


/* =========================
   BUTTONS
========================= */

.dashboard-btn{

  width:100%;

  border:none;

  padding:16px;

  border-radius:13px;

  cursor:pointer;

  color:white;

  font-size:16px;

  font-weight:bold;

  background:
  linear-gradient(
    135deg,
    #6526d7,
    #8b5cf6
  );

  box-shadow:
  0 12px 25px
  rgba(101,38,215,.25);

  transition:.25s;

}


.dashboard-btn:hover{

  transform:
  translateY(-2px);

}


.course-btn{

  width:100%;

  margin-top:12px;

  border:
  1px solid #ddd6fe;

  padding:14px;

  border-radius:13px;

  cursor:pointer;

  background:white;

  color:#6526d7;

  font-size:15px;

  font-weight:bold;

}


/* =========================
   FOOTER TEXT
========================= */

.footer-text{

  margin-top:22px;

  font-size:13px;

  color:#94a3b8;

}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

  .success-card{

    padding:
    35px 20px;

  }

  .success-title{

    font-size:27px;

  }

  .success-icon{

    width:80px;
    height:80px;

    font-size:42px;

  }

}

</style></head><body><!-- =========================
     PAYMENT SUCCESS CARD
========================= --><div class="success-card"><div class="success-icon">✓

</div><h1 class="success-title">Payment Successful!

</h1><p class="success-message">🎉 Congratulations! आपका Payment Successfully Complete हो गया है।
आपका Course अब आपके Account में Activate कर दिया गया है।

</p><!-- =========================
     PAYMENT DETAILS
========================= --><div class="payment-details"><div class="detail-row"><span class="detail-label">Course

</span><span
class="detail-value"
id="courseName">

Loading...

</span></div><div class="detail-row"><span class="detail-label">Amount Paid

</span><span
class="detail-value"
id="coursePrice">

₹0

</span></div><div class="detail-row"><span class="detail-label">Payment Status

</span><span class="payment-status">✓ Successful

</span></div></div><!-- =========================
     BUTTONS
========================= --><button
class="dashboard-btn"
onclick="goDashboard()">

🏠 Go To Dashboard

</button><button
class="course-btn"
onclick="goCourses()">

📚 View My Courses

</button><div class="footer-text">Padho Aur Kamao • Learn • Earn • Grow

</div></div><!-- =========================
     JAVASCRIPT
========================= --><script>


/* =========================
   GET URL PARAMETERS
========================= */

const urlParams=

new URLSearchParams(
window.location.search
);


const urlCourseId=

urlParams.get(
"course"
);


const urlPrice=

urlParams.get(
"price"
);



/* =========================
   COURSE DATA
========================= */

let courseId=

urlCourseId

||

localStorage.getItem(
"pendingCourseId"
);


let courseName=

localStorage.getItem(
"pendingCourseName"
);


let coursePrice=

urlPrice

||

localStorage.getItem(
"pendingCoursePrice"
);


/* =========================
   COURSE NAME FALLBACK
========================= */

if(
!courseName
){

if(
courseId
===
"study-skill-starter"
){

courseName=
"Study & Skill Starter";

}

else if(
courseId
===
"skill-success-premium"
){

courseName=
"Skill & Success Premium";

}

else{

courseName=
"Your Course";

}

}


/* =========================
   COURSE PRICE FALLBACK
========================= */

if(
!coursePrice
){

coursePrice=
"0";

}


/* =========================
   SAVE PURCHASE
========================= */

localStorage.setItem(

"coursePurchased",

"true"

);


localStorage.setItem(

"purchasedCourseId",

courseId

||
"unknown-course"

);


localStorage.setItem(

"purchasedCourseName",

courseName

);


localStorage.setItem(

"purchasedCoursePrice",

coursePrice

);


localStorage.setItem(

"paymentStatus",

"paid"

);


localStorage.setItem(

"paymentCompletedAt",

new Date().toISOString()

);



/* =========================
   CLEAR PENDING DATA
========================= */

localStorage.removeItem(
"pendingCourseId"
);


localStorage.removeItem(
"pendingCourseName"
);


localStorage.removeItem(
"pendingCoursePrice"
);



/* =========================
   UPDATE PAGE
========================= */

document
.getElementById(
"courseName"
)
.textContent=

courseName;


document
.getElementById(
"coursePrice"
)
.textContent=

"₹"+coursePrice;



/* =========================
   GO DASHBOARD
========================= */

function goDashboard(){

window.location.href=
"dashboard.html";

}



/* =========================
   GO MY COURSES
========================= */

function goCourses(){

window.location.href=
"dashboard.html";

}


</script></body>
</html>
