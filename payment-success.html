<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Payment Successful - Padho Aur Kamao
</title>


<style>

/* =========================
   GLOBAL
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,Helvetica,sans-serif;

  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  background:
  linear-gradient(
    135deg,
    #eef2ff,
    #fdf4ff,
    #ecfdf5
  );

  color:#172033;
}


/* =========================
   SUCCESS CARD
========================= */

.success-card{

  width:100%;
  max-width:520px;

  background:white;

  border-radius:28px;

  padding:40px 30px;

  text-align:center;

  box-shadow:
  0 25px 70px
  rgba(15,23,42,.15);

  border:
  1px solid
  rgba(255,255,255,.8);

  animation:
  cardAnimation
  .5s ease;

}


@keyframes cardAnimation{

  from{
    opacity:0;

    transform:
    translateY(30px)
    scale(.96);
  }

  to{
    opacity:1;

    transform:
    translateY(0)
    scale(1);
  }

}


/* =========================
   SUCCESS ICON
========================= */

.success-icon{

  width:90px;
  height:90px;

  margin:
  0 auto
  25px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:48px;

  background:
  linear-gradient(
    135deg,
    #22c55e,
    #16a34a
  );

  color:white;

  box-shadow:
  0 15px 30px
  rgba(34,197,94,.3);

  animation:
  successPop
  .6s ease;

}


@keyframes successPop{

  0%{

    transform:
    scale(0);

  }

  70%{

    transform:
    scale(1.15);

  }

  100%{

    transform:
    scale(1);

  }

}


/* =========================
   TEXT
========================= */

.success-title{

  font-size:32px;

  font-weight:800;

  margin-bottom:12px;

  color:#166534;

}


.success-message{

  color:#64748b;

  font-size:15px;

  line-height:1.6;

  margin-bottom:28px;

}


/* =========================
   PAYMENT DETAILS
========================= */

.payment-details{

  background:#f8fafc;

  border-radius:18px;

  padding:20px;

  text-align:left;

  margin-bottom:25px;

}


.detail-row{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:15px;

  padding:13px 0;

  border-bottom:
  1px solid #e5e7eb;

  font-size:14px;

}


.detail-row:last-child{

  border-bottom:none;

}


.detail-label{

  color:#64748b;

}


.detail-value{

  font-weight:bold;

  color:#172033;

  text-align:right;

}


.payment-status{

  display:inline-block;

  padding:
  7px 12px;

  border-radius:20px;

  background:#dcfce7;

  color:#166534;

  font-size:12px;

  font-weight:bold;

}


/* =========================
   BUTTONS
========================= */

.dashboard-btn{

  width:100%;

  border:none;

  padding:16px;

  border-radius:13px;

  cursor:pointer;

  color:white;

  font-size:16px;

  font-weight:bold;

  background:
  linear-gradient(
    135deg,
    #6526d7,
    #8b5cf6
  );

  box-shadow:
  0 12px 25px
  rgba(101,38,215,.25);

}


.course-btn{

  width:100%;

  margin-top:12px;

  border:
  1px solid #ddd6fe;

  padding:14px;

  border-radius:13px;

  cursor:pointer;

  background:white;

  color:#6526d7;

  font-size:15px;

  font-weight:bold;

}


.footer-text{

  margin-top:22px;

  font-size:13px;

  color:#94a3b8;

}


@media(max-width:500px){

  .success-card{

    padding:
    35px 20px;

  }

  .success-title{

    font-size:27px;

  }

  .success-icon{

    width:80px;
    height:80px;

    font-size:42px;

  }

}

</style>

</head>


<body>


<!-- SUCCESS CARD -->

<div class="success-card">


<div class="success-icon">
✓
</div>


<h1 class="success-title">
Payment Successful!
</h1>


<p class="success-message">

🎉 Congratulations! आपका Payment Successfully Complete हो गया है।

<br>

आपका Course अब आपके Account में Activate कर दिया गया है।

</p>



<!-- PAYMENT DETAILS -->

<div class="payment-details">


<div class="detail-row">

<span class="detail-label">
Course
</span>


<span
class="detail-value"
id="courseName">

Loading...

</span>

</div>



<div class="detail-row">

<span class="detail-label">
Amount Paid
</span>


<span
class="detail-value"
id="coursePrice">

₹0

</span>

</div>



<div class="detail-row">

<span class="detail-label">
Payment Status
</span>


<span class="payment-status">
✓ Successful
</span>

</div>


</div>



<!-- BUTTONS -->

<button
class="dashboard-btn"
id="dashboardBtn">

🏠 Go To Dashboard

</button>


<button
class="course-btn"
id="coursesBtn">

📚 View My Courses

</button>


<div class="footer-text">

Padho Aur Kamao • Learn • Earn • Grow

</div>


</div>



<script type="module">


/* ==================================
   FIREBASE IMPORTS
================================== */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {

getAuth,
onAuthStateChanged

}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {

getFirestore,
doc,
getDoc,
setDoc,
collection,
query,
where,
limit,
getDocs,
runTransaction,
serverTimestamp

}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ==================================
   FIREBASE CONFIG
================================== */

const firebaseConfig = {

apiKey:
"AIzaSyDhYPTmWOqYgUOk3a0QK0WJBFIYlGZdWA0",

authDomain:
"padho-aur-kamao-3eeae.firebaseapp.com",

projectId:
"padho-aur-kamao-3eeae",

storageBucket:
"padho-aur-kamao-3eeae.firebasestorage.app",

messagingSenderId:
"670063905617",

appId:
"1:670063905617:web:9b3a7e62fdeea14fbfa170"

};


/* ==================================
   INITIALIZE
================================== */

const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const db =
getFirestore(app);



/* ==================================
   COMMISSION SETTINGS

   CHANGE 10 TO YOUR DESIRED %
================================== */

const COMMISSION_PERCENT =
10;



/* ==================================
   URL PARAMETERS
================================== */

const urlParams =
new URLSearchParams(
window.location.search
);


const urlCourseId =
urlParams.get("course");


const urlPrice =
urlParams.get("price");


const urlRef =
urlParams.get("ref");


const urlPaymentId =
urlParams.get("payment_id") ||
urlParams.get("order_id") ||
urlParams.get("transaction_id");



/* ==================================
   COURSE DATA
================================== */

let courseId =

urlCourseId ||

localStorage.getItem(
"pendingCourseId"
);


let courseName =

localStorage.getItem(
"pendingCourseName"
);


let coursePrice =

urlPrice ||

localStorage.getItem(
"pendingCoursePrice"
);



/* ==================================
   COURSE NAME FALLBACK
================================== */

if(!courseName){

if(
courseId ===
"study-skill-starter"
){

courseName =
"Study & Skill Starter";

}

else if(
courseId ===
"skill-success-premium"
){

courseName =
"Skill & Success Premium";

}

else{

courseName =
"Your Course";

}

}



/* ==================================
   COURSE PRICE FALLBACK
================================== */

if(
!coursePrice
){

coursePrice =
"0";

}



/* ==================================
   FORMAT PRICE
================================== */

function getNumericPrice(value){

return Number(

String(value)

.replace(
/[^0-9.]/g,
""
)

) || 0;

}


const numericCoursePrice =
getNumericPrice(
coursePrice
);



/* ==================================
   PAYMENT TIME

   SAME TIME SAVED FOR DUPLICATE
   PROTECTION
================================== */

let paymentCompletedAt =
localStorage.getItem(
"paymentCompletedAt"
);


if(
!paymentCompletedAt
){

paymentCompletedAt =
new Date()
.toISOString();


localStorage.setItem(

"paymentCompletedAt",

paymentCompletedAt

);

}



/* ==================================
   PURCHASE ID

   REAL PAYMENT ID IF AVAILABLE
================================== */

const purchaseId =

urlPaymentId ||

(

String(courseId || "course")

.replace(
/[^a-zA-Z0-9_-]/g,
""
)

+

"_"

+

String(paymentCompletedAt)

.replace(
/[^0-9]/g,
""
)

);



/* ==================================
   GET REFERRAL CODE

   CHECK MULTIPLE LOCATIONS
================================== */

function getReferralCode(){


const savedCode =

urlRef ||

localStorage.getItem(
"pendingReferrerCode"
) ||

localStorage.getItem(
"referrerCode"
) ||

localStorage.getItem(
"ref"
);


if(!savedCode){

return "";

}


return String(
savedCode
)

.trim()

.toUpperCase();

}


const referralCode =
getReferralCode();



/* ==================================
   UPDATE PAGE
================================== */

document
.getElementById(
"courseName"
)
.textContent =
courseName;


document
.getElementById(
"coursePrice"
)
.textContent =
"₹" +
coursePrice;



/* ==================================
   AUTH CHECK
================================== */

onAuthStateChanged(
auth,
async user => {


if(!user){

alert(
"कृपया पहले Login करें।"
);


window.location.href =
"login.html";


return;

}


try{


await processSuccessfulPayment(
user
);


}
catch(error){

console.error(
"Payment processing error:",
error
);

alert(
"Payment successful है, लेकिन course processing में समस्या हुई। कृपया Dashboard check करें।"
);

}

}
);



/* ==================================
   PROCESS PAYMENT
================================== */

async function processSuccessfulPayment(user){


const userRef =

doc(
db,
"users",
user.uid
);


/* -------------------------------
   ACTIVATE COURSE
-------------------------------- */

const courseRef =

doc(
db,
"users",
user.uid,
"courses",
String(
courseId ||
"unknown-course"
)
);


await setDoc(

courseRef,

{

courseId:

courseId ||
"unknown-course",


courseName:

courseName,


coursePrice:

numericCoursePrice,


paymentStatus:

"paid",


purchaseId:

purchaseId,


purchasedAt:

serverTimestamp(),


updatedAt:

serverTimestamp()

},

{
merge:true
}

);



/* -------------------------------
   SAVE LOCAL PURCHASE
-------------------------------- */

localStorage.setItem(

"coursePurchased",

"true"

);


localStorage.setItem(

"purchasedCourseId",

courseId ||
"unknown-course"

);


localStorage.setItem(

"purchasedCourseName",

courseName

);


localStorage.setItem(

"purchasedCoursePrice",

coursePrice

);


localStorage.setItem(

"paymentStatus",

"paid"

);



/* -------------------------------
   NO REFERRAL CODE
-------------------------------- */

if(
!referralCode
){

clearPendingData();

return;

}



/* -------------------------------
   FIND REFERRER
-------------------------------- */

const usersQuery =

query(

collection(
db,
"users"
),

where(
"referralCode",
"==",
referralCode
),

limit(1)

);


const referrerSnapshot =
await getDocs(
usersQuery
);


if(
referrerSnapshot.empty
){

console.log(
"Referral code not found:",
referralCode
);

clearPendingData();

return;

}


const referrerDoc =
referrerSnapshot.docs[0];


const referrerId =
referrerDoc.id;



/* -------------------------------
   SELF REFERRAL BLOCK
-------------------------------- */

if(
referrerId ===
user.uid
){

console.log(
"Self referral blocked"
);

clearPendingData();

return;

}



/* -------------------------------
   COMMISSION CALCULATION
-------------------------------- */

const commissionAmount =

Number(

(

numericCoursePrice *

COMMISSION_PERCENT

/

100

)

.toFixed(2)

);



/* -------------------------------
   NO COMMISSION FOR ZERO PRICE
-------------------------------- */

if(
commissionAmount <= 0
){

clearPendingData();

return;

}



/* -------------------------------
   REFERENCES
-------------------------------- */

const purchaseRef =

doc(
db,
"purchases",
purchaseId
);


const commissionRef =

doc(
db,
"users",
referrerId,
"commissions",
purchaseId
);


const referrerUserRef =

doc(
db,
"users",
referrerId
);



/* ==================================
   TRANSACTION

   PREVENTS DUPLICATE COMMISSION
================================== */

await runTransaction(
db,
async transaction => {


const purchaseSnap =

await transaction.get(
purchaseRef
);


/* --------------------------------
   ALREADY PROCESSED
-------------------------------- */

if(
purchaseSnap.exists()
){

console.log(
"Purchase already processed"
);

return;

}



/* --------------------------------
   GET REFERRER DATA
-------------------------------- */

const referrerUserSnap =

await transaction.get(
referrerUserRef
);


const referrerData =

referrerUserSnap.exists()

?

referrerUserSnap.data()

:

{};



/* --------------------------------
   CURRENT TOTAL
-------------------------------- */

const oldTotal =

Number(
referrerData.totalCommission || 0
);



/* --------------------------------
   SAVE PURCHASE RECORD
-------------------------------- */

transaction.set(

purchaseRef,

{

purchaseId:

purchaseId,


buyerUid:

user.uid,


courseId:

courseId ||
"unknown-course",


courseName:

courseName,


coursePrice:

numericCoursePrice,


referrerUid:

referrerId,


referralCode:

referralCode,


commissionAmount:

commissionAmount,


status:

"completed",


createdAt:

serverTimestamp()

}

);



/* --------------------------------
   SAVE COMMISSION RECORD
-------------------------------- */

transaction.set(

commissionRef,

{

purchaseId:

purchaseId,


buyerUid:

user.uid,


courseId:

courseId ||
"unknown-course",


courseName:

courseName,


coursePrice:

numericCoursePrice,


commissionAmount:

commissionAmount,


commissionPercent:

COMMISSION_PERCENT,


referralCode:

referralCode,


status:

"credited",


createdAt:

serverTimestamp()

}

);



/* --------------------------------
   UPDATE REFERRER TOTAL
-------------------------------- */

transaction.set(

referrerUserRef,

{

totalCommission:

oldTotal +
commissionAmount,


updatedAt:

serverTimestamp()

},

{
merge:true
}

);


}
);



console.log(
"Commission processed successfully"
);



/* -------------------------------
   CLEAR REFERRAL AFTER SUCCESS
-------------------------------- */

clearPendingData();


}



/* ==================================
   CLEAR PENDING DATA
================================== */

function clearPendingData(){


localStorage.removeItem(
"pendingCourseId"
);


localStorage.removeItem(
"pendingCourseName"
);


localStorage.removeItem(
"pendingCoursePrice"
);


/*
Referral remove only after
successful processing
*/

localStorage.removeItem(
"pendingReferrerCode"
);


localStorage.removeItem(
"referrerCode"
);


localStorage.removeItem(
"ref"
);


}



/* ==================================
   GO DASHBOARD
================================== */

document
.getElementById(
"dashboardBtn"
)
.addEventListener(
"click",
() => {

window.location.href =
"dashboard.html";

}
);



/* ==================================
   GO COURSES
================================== */

document
.getElementById(
"coursesBtn"
)
.addEventListener(
"click",
() => {

window.location.href =
"dashboard.html";

}
);


</script>


</body>

</html>
