<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>Login - Padho Aur Kamao</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#eef2ff,#f5f3ff);
}

.box{
  width:92%;
  max-width:420px;
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:0 10px 35px #0002;
}

.logo{
  text-align:center;
  font-size:28px;
  margin-bottom:5px;
}

.subtitle{
  text-align:center;
  color:#6b7280;
  margin-bottom:25px;
}

input{
  width:100%;
  padding:14px;
  margin:7px 0 13px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#6366f1;
}

button{
  width:100%;
  padding:14px;
  margin-top:8px;
  border:0;
  border-radius:10px;
  background:#6d28d9;
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.google{
  background:#111827;
}

.message{
  min-height:22px;
  text-align:center;
  margin-top:15px;
  font-size:14px;
}

.home{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#5b21b6;
  text-decoration:none;
}

</style>

</head>


<body>

<div class="box">

  <div class="logo">
    📚 Padho Aur Kamao
  </div>

  <div class="subtitle">
    Login करें या नया account बनाएँ
  </div>


  <input
    id="name"
    type="text"
    placeholder="आपका नाम">


  <input
    id="email"
    type="email"
    placeholder="Email">


  <input
    id="password"
    type="password"
    placeholder="Password">


  <button id="signupBtn">
    Create Account
  </button>


  <button id="loginBtn">
    Login
  </button>


  <button
    id="googleBtn"
    class="google">

    Continue with Google

  </button>


  <div
    id="message"
    class="message">
  </div>


  <a
    class="home"
    href="index.html">

    ← Home पर जाएँ

  </a>

</div>


<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup,
  updateProfile
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,
  doc,
  setDoc
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

  apiKey:
  "AIzaSyDhYPTmWOqYgUOk3a0QK0WJBFIYlGZdWA0",

  authDomain:
  "padho-aur-kamao-3eeae.firebaseapp.com",

  projectId:
  "padho-aur-kamao-3eeae",

  storageBucket:
  "padho-aur-kamao-3eeae.firebasestorage.app",

  messagingSenderId:
  "670063905617",

  appId:
  "1:670063905617:web:9b3a7e62fdeea14fbfa170",

  measurementId:
  "G-7J1YV8HN3F"

};


/* INITIALIZE */

const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const db =
getFirestore(app);


const message =
document.getElementById("message");


const signupBtn =
document.getElementById("signupBtn");


const loginBtn =
document.getElementById("loginBtn");


const googleBtn =
document.getElementById("googleBtn");


/* MESSAGE */

function showMessage(text){

  message.innerText = text;

}


/* SIGNUP */

signupBtn.addEventListener(
"click",
async function(){

  const name =
  document.getElementById("name")
  .value
  .trim();


  const email =
  document.getElementById("email")
  .value
  .trim();


  const password =
  document.getElementById("password")
  .value;


  if(!name){

    showMessage(
      "⚠️ अपना नाम डालें।"
    );

    return;

  }


  if(!email){

    showMessage(
      "⚠️ Email डालें।"
    );

    return;

  }


  if(password.length < 6){

    showMessage(
      "⚠️ Password कम से कम 6 characters का होना चाहिए।"
    );

    return;

  }


  signupBtn.disabled = true;


  try{

    const result =
    await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );


    await updateProfile(
      result.user,
      {
        displayName:name
      }
    );


    await setDoc(
      doc(
        db,
        "users",
        result.user.uid
      ),
      {

        name:name,

        email:email,

        enrolledCourses:[],

        createdAt:
        new Date().toISOString()

      }
    );


    showMessage(
      "✅ Account बन गया!"
    );


    setTimeout(
      function(){

        window.location.href =
        "dashboard.html";

      },
      1000
    );


  }

  catch(error){

    console.error(error);

    showMessage(
      "❌ " + getFriendlyError(error)
    );

  }

  finally{

    signupBtn.disabled = false;

  }

});


/* LOGIN */

loginBtn.addEventListener(
"click",
async function(){

  const email =
  document.getElementById("email")
  .value
  .trim();


  const password =
  document.getElementById("password")
  .value;


  if(!email || !password){

    showMessage(
      "⚠️ Email और Password भरें।"
    );

    return;

  }


  loginBtn.disabled = true;


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );


    showMessage(
      "✅ Login successful!"
    );


    setTimeout(
      function(){

        window.location.href =
        "dashboard.html";

      },
      700
    );


  }

  catch(error){

    console.error(error);

    showMessage(
      "❌ " + getFriendlyError(error)
    );

  }

  finally{

    loginBtn.disabled = false;

  }

});


/* GOOGLE LOGIN */

googleBtn.addEventListener(
"click",
async function(){

  googleBtn.disabled = true;


  try{

    const provider =
    new GoogleAuthProvider();


    const result =
    await signInWithPopup(
      auth,
      provider
    );


    await setDoc(
      doc(
        db,
        "users",
        result.user.uid
      ),
      {

        name:
        result.user.displayName || "",

        email:
        result.user.email || "",

        enrolledCourses:[],

        updatedAt:
        new Date().toISOString()

      },
      {
        merge:true
      }
    );


    window.location.href =
    "dashboard.html";

  }

  catch(error){

    console.error(error);

    showMessage(
      "❌ " + getFriendlyError(error)
    );

  }

  finally{

    googleBtn.disabled = false;

  }

});


/* FRIENDLY ERRORS */

function getFriendlyError(error){

  const code =
  error.code || "";


  if(code ===
  "auth/email-already-in-use"){

    return "यह Email पहले से registered है। Login करें।";

  }


  if(code ===
  "auth/invalid-email"){

    return "Email सही नहीं है।";

  }


  if(code ===
  "auth/weak-password"){

    return "Password बहुत कमजोर है।";

  }


  if(code ===
  "auth/invalid-credential"){

    return "Email या Password गलत है।";

  }


  if(code ===
  "auth/network-request-failed"){

    return "Firebase से connection नहीं हो रहा। Internet और Authorized Domain check करें।";

  }


  if(code ===
  "auth/popup-blocked"){

    return "Google Login popup block हो गया।";

  }


  return error.message ||
  "कुछ समस्या हुई।";

}

</script>

</body>

</html>
