<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - Padho Aur Kamao</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial,sans-serif;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#2563eb,#7c3aed);
      padding:20px;
    }

    .container{
      width:100%;
      max-width:420px;
      background:white;
      padding:30px 25px;
      border-radius:20px;
      box-shadow:0 15px 40px rgba(0,0,0,.25);
    }

    .logo{
      text-align:center;
      font-size:28px;
      font-weight:bold;
      color:#2563eb;
      margin-bottom:8px;
    }

    .subtitle{
      text-align:center;
      color:#6b7280;
      margin-bottom:25px;
    }

    .tabs{
      display:flex;
      margin-bottom:25px;
      border-bottom:1px solid #ddd;
    }

    .tab{
      width:50%;
      padding:12px;
      border:0;
      background:none;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      color:#777;
    }

    .tab.active{
      color:#2563eb;
      border-bottom:3px solid #2563eb;
    }

    .form{
      display:none;
    }

    .form.active{
      display:block;
    }

    label{
      display:block;
      margin-bottom:7px;
      font-weight:bold;
      color:#374151;
    }

    input{
      width:100%;
      padding:13px;
      border:1px solid #d1d5db;
      border-radius:10px;
      margin-bottom:17px;
      font-size:15px;
      outline:none;
    }

    input:focus{
      border-color:#2563eb;
    }

    .btn{
      width:100%;
      padding:14px;
      border:0;
      border-radius:10px;
      background:#2563eb;
      color:white;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }

    .btn:hover{
      background:#1d4ed8;
    }

    .google-btn{
      margin-top:12px;
      background:#111827;
    }

    .google-btn:hover{
      background:#000;
    }

    .forgot{
      text-align:right;
      margin:-8px 0 15px;
    }

    .forgot a{
      color:#2563eb;
      text-decoration:none;
      font-size:14px;
      cursor:pointer;
    }

    .message{
      margin-top:15px;
      padding:10px;
      border-radius:8px;
      text-align:center;
      display:none;
      font-size:14px;
    }

    .success{
      display:block;
      background:#dcfce7;
      color:#166534;
    }

    .error{
      display:block;
      background:#fee2e2;
      color:#991b1b;
    }

    .loading{
      opacity:.7;
      pointer-events:none;
    }

    .footer{
      text-align:center;
      margin-top:20px;
      color:#6b7280;
      font-size:13px;
    }

    .referral-box{
      display:none;
      background:#eff6ff;
      color:#1e40af;
      padding:10px;
      border-radius:8px;
      margin-bottom:15px;
      text-align:center;
      font-size:13px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">📚 Padho Aur Kamao</div>

  <div class="subtitle">
    पढ़ाई करें • ज्ञान बढ़ाएँ • आगे बढ़ें
  </div>

  <div id="referralBox" class="referral-box">
    🔗 Referral से Signup
    <br>
    <strong id="referralCodeText"></strong>
  </div>

  <div class="tabs">

    <button class="tab active" id="loginTab">
      Login
    </button>

    <button class="tab" id="signupTab">
      Signup
    </button>

  </div>


  <!-- LOGIN -->

  <form id="loginForm" class="form active">

    <label>Email</label>

    <input
      type="email"
      id="loginEmail"
      placeholder="अपना Email डालें"
      required
    >

    <label>Password</label>

    <input
      type="password"
      id="loginPassword"
      placeholder="अपना Password डालें"
      required
    >

    <div class="forgot">
      <a id="forgotPassword">
        Password भूल गए?
      </a>
    </div>

    <button
      type="submit"
      class="btn"
      id="loginBtn"
    >
      Login
    </button>

    <button
      type="button"
      class="btn google-btn"
      id="googleBtn"
    >
      🔵 Continue with Google
    </button>

  </form>


  <!-- SIGNUP -->

  <form id="signupForm" class="form">

    <label>नाम</label>

    <input
      type="text"
      id="signupName"
      placeholder="अपना नाम डालें"
      required
    >

    <label>Email</label>

    <input
      type="email"
      id="signupEmail"
      placeholder="अपना Email डालें"
      required
    >

    <label>Password</label>

    <input
      type="password"
      id="signupPassword"
      placeholder="कम से कम 6 characters"
      minlength="6"
      required
    >

    <label>Confirm Password</label>

    <input
      type="password"
      id="confirmPassword"
      placeholder="Password दोबारा डालें"
      minlength="6"
      required
    >

    <button
      type="submit"
      class="btn"
      id="signupBtn"
    >
      Create Account
    </button>

  </form>


  <div id="message" class="message"></div>

  <div class="footer">
    © 2026 Padho Aur Kamao
  </div>

</div>


<script type="module">

/* =========================================
   FIREBASE IMPORTS
========================================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup,
  sendPasswordResetEmail,
  updateProfile
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  getDoc,
  addDoc,
  collection,
  serverTimestamp,
  increment
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyDhYPTmWOqYgUOk3a0QK0WJBFIYlGZdWA0",

  authDomain:
  "padho-aur-kamao-3eeae.firebaseapp.com",

  projectId:
  "padho-aur-kamao-3eeae",

  storageBucket:
  "padho-aur-kamao-3eeae.firebasestorage.app",

  messagingSenderId:
  "670063905617",

  appId:
  "1:670063905617:web:9b3a7e62fdeea14fbfa170"

};


/* =========================================
   INITIALIZE
========================================= */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);

const googleProvider =
  new GoogleAuthProvider();


/* =========================================
   ELEMENTS
========================================= */

const loginTab =
  document.getElementById("loginTab");

const signupTab =
  document.getElementById("signupTab");

const loginForm =
  document.getElementById("loginForm");

const signupForm =
  document.getElementById("signupForm");

const message =
  document.getElementById("message");

const referralBox =
  document.getElementById("referralBox");

const referralCodeText =
  document.getElementById("referralCodeText");


/* =========================================
   REFERRAL CODE FROM URL
========================================= */

const urlParams =
  new URLSearchParams(
    window.location.search
  );

const referralCode =
  urlParams.get("ref");


if(referralCode){

  const cleanCode =
    referralCode.trim().toUpperCase();

  if(cleanCode){

    localStorage.setItem(
      "padhoAurKamaoReferral",
      cleanCode
    );

    referralCodeText.textContent =
      cleanCode;

    referralBox.style.display =
      "block";

    /* Automatically open Signup */

    signupTab.click();

  }

}


/* =========================================
   GET SAVED REFERRAL
========================================= */

function getReferralCode(){

  return (
    localStorage.getItem(
      "padhoAurKamaoReferral"
    ) || null
  );

}


/* =========================================
   MESSAGE
========================================= */

function showMessage(
  text,
  type
){

  message.textContent =
    text;

  message.className =
    "message " + type;

}


function clearMessage(){

  message.textContent =
    "";

  message.className =
    "message";

}


/* =========================================
   TABS
========================================= */

loginTab.addEventListener(
  "click",
  ()=>{

    loginTab.classList.add("active");

    signupTab.classList.remove("active");

    loginForm.classList.add("active");

    signupForm.classList.remove("active");

    clearMessage();

  }
);


signupTab.addEventListener(
  "click",
  ()=>{

    signupTab.classList.add("active");

    loginTab.classList.remove("active");

    signupForm.classList.add("active");

    loginForm.classList.remove("active");

    clearMessage();

  }
);


/* =========================================
   FIND REFERRER
========================================= */

async function findReferrer(
  referralCode
){

  if(!referralCode){

    return null;

  }


  try{

    /*
      Referral code को users collection
      में खोज रहे हैं।
    */

    const usersRef =
      collection(db,"users");


    /*
      Firestore query के लिए
      पहले सभी matching documents
      खोजने का सरल तरीका नहीं है
      बिना query import के।

      इसलिए known referral code के लिए
      हम local lookup helper इस्तेमाल
      करने की कोशिश करते हैं।
    */

    /*
      यह function नीचे query-based
      version से replace किया गया है।
    */

    return null;

  }

  catch(error){

    console.error(
      "Referrer search error:",
      error
    );

    return null;

  }

}


/* =========================================
   CREATE USER PROFILE + REFERRAL
========================================= */

async function createUserProfile(
  user,
  name
){

  const userRef =
    doc(
      db,
      "users",
      user.uid
    );


  const referralCode =
    generateReferralCode(
      user.uid
    );


  const savedReferral =
    getReferralCode();


  let referrerUid =
    null;


  let referrerCode =
    null;


  /*
    Referral code मिलने पर
    users collection में search करेंगे।
  */

  if(savedReferral){

    try{

      const {
        collection: firestoreCollection,
        getDocs,
        query,
        where
      } = await import(
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js"
      );


      const usersQuery =
        query(
          firestoreCollection(
            db,
            "users"
          ),
          where(
            "referralCode",
            "==",
            savedReferral
          )
        );


      const result =
        await getDocs(
          usersQuery
        );


      if(!result.empty){

        const referrer =
          result.docs[0];

        referrerUid =
          referrer.id;

        referrerCode =
          savedReferral;

      }

    }

    catch(error){

      console.error(
        "Referral lookup error:",
        error
      );

    }

  }


  /* =====================================
     SAVE NEW USER
  ===================================== */

  await setDoc(
    userRef,
    {

      name:
        name ||
        user.displayName ||
        user.email.split("@")[0],

      email:
        user.email,

      referralCode:
        referralCode,

      referredBy:
        referrerUid,

      points:
        0,

      totalReferrals:
        0,

      createdAt:
        serverTimestamp()

    }
  );


  /* =====================================
     CREATE REFERRAL RECORD
  ===================================== */

  if(
    referrerUid &&
    referrerUid !== user.uid
  ){

    try{

      await addDoc(
        collection(
          db,
          "referrals"
        ),
        {

          referrerUid:
            referrerUid,

          referredUid:
            user.uid,

          referralCode:
            referrerCode,

          createdAt:
            serverTimestamp(),

          status:
            "registered"

        }
      );


      /*
        Referrer के points और
        referral count बढ़ाएँ।
      */

      await setDoc(
        doc(
          db,
          "users",
          referrerUid
        ),
        {

          points:
            increment(1),

          totalReferrals:
            increment(1)

        },
        {
          merge:true
        }
      );


      console.log(
        "Referral successfully recorded."
      );


    }

    catch(error){

      console.error(
        "Referral record error:",
        error
      );

    }

  }


  /*
    Referral को एक बार process
    होने के बाद हटाएँ।
  */

  localStorage.removeItem(
    "padhoAurKamaoReferral"
  );

}


/* =========================================
   GENERATE REFERRAL CODE
========================================= */

function generateReferralCode(
  uid
){

  const shortUid =
    uid
      .substring(0,6)
      .toUpperCase();

  const random =
    Math.floor(
      100 +
      Math.random()*900
    );

  return (
    "PAK" +
    shortUid +
    random
  );

}


/* =========================================
   LOGIN
========================================= */

loginForm.addEventListener(
  "submit",
  async(e)=>{

    e.preventDefault();

    clearMessage();


    const email =
      document
        .getElementById(
          "loginEmail"
        )
        .value
        .trim();


    const password =
      document
        .getElementById(
          "loginPassword"
        )
        .value;


    const button =
      document.getElementById(
        "loginBtn"
      );


    try{

      button.textContent =
        "Login हो रहा है...";

      button.classList.add(
        "loading"
      );


      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


      showMessage(
        "Login सफल! Dashboard खुल रहा है...",
        "success"
      );


      setTimeout(
        ()=>{

          window.location.href =
            "dashboard.html";

        },
        1000
      );

    }

    catch(error){

      console.error(error);


      let text =
        "Login नहीं हो पाया।";


      if(
        error.code ===
        "auth/invalid-credential"
      ){

        text =
          "Email या Password गलत है।";

      }

      else if(
        error.code ===
        "auth/user-not-found"
      ){

        text =
          "यह Email registered नहीं है।";

      }

      else if(
        error.code ===
        "auth/wrong-password"
      ){

        text =
          "Password गलत है।";

      }

      else if(
        error.code ===
        "auth/invalid-email"
      ){

        text =
          "Email सही format में डालें।";

      }


      showMessage(
        text,
        "error"
      );

    }

    finally{

      button.textContent =
        "Login";

      button.classList.remove(
        "loading"
      );

    }

  }
);


/* =========================================
   SIGNUP
========================================= */

signupForm.addEventListener(
  "submit",
  async(e)=>{

    e.preventDefault();

    clearMessage();


    const name =
      document
        .getElementById(
          "signupName"
        )
        .value
        .trim();


    const email =
      document
        .getElementById(
          "signupEmail"
        )
        .value
        .trim();


    const password =
      document
        .getElementById(
          "signupPassword"
        )
        .value;


    const confirmPassword =
      document
        .getElementById(
          "confirmPassword"
        )
        .value;


    const button =
      document.getElementById(
        "signupBtn"
      );


    if(
      password !==
      confirmPassword
    ){

      showMessage(
        "दोनों Password समान होने चाहिए।",
        "error"
      );

      return;

    }


    if(
      password.length < 6
    ){

      showMessage(
        "Password कम से कम 6 characters का होना चाहिए।",
        "error"
      );

      return;

    }


    try{

      button.textContent =
        "Account बनाया जा रहा है...";

      button.classList.add(
        "loading"
      );


      /* Create Firebase account */

      const userCredential =
        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );


      const user =
        userCredential.user;


      /* Save display name */

      await updateProfile(
        user,
        {
          displayName:
            name
        }
      );


      /* Create Firestore profile
         and process referral */

      await createUserProfile(
        user,
        name
      );


      showMessage(
        "Account सफलतापूर्वक बन गया!",
        "success"
      );


      setTimeout(
        ()=>{

          window.location.href =
            "dashboard.html";

        },
        1200
      );

    }

    catch(error){

      console.error(error);


      let text =
        "Account नहीं बन पाया।";


      if(
        error.code ===
        "auth/email-already-in-use"
      ){

        text =
          "यह Email पहले से registered है।";

      }

      else if(
        error.code ===
        "auth/invalid-email"
      ){

        text =
          "Email सही format में डालें।";

      }

      else if(
        error.code ===
        "auth/weak-password"
      ){

        text =
          "Password बहुत कमजोर है।";

      }


      showMessage(
        text,
        "error"
      );

    }

    finally{

      button.textContent =
        "Create Account";

      button.classList.remove(
        "loading"
      );

    }

  }
);


/* =========================================
   GOOGLE LOGIN
========================================= */

document
  .getElementById(
    "googleBtn"
  )
  .addEventListener(
    "click",
    async()=>{

      try{

        clearMessage();


        const result =
          await signInWithPopup(
            auth,
            googleProvider
          );


        const user =
          result.user;


        /*
          Google user पहली बार आया है
          तो Firestore profile बनाएं।
        */

        const userRef =
          doc(
            db,
            "users",
            user.uid
          );


        const existing =
          await getDoc(
            userRef
          );


        if(!existing.exists()){

          await createUserProfile(
            user,
            user.displayName ||
            user.email.split("@")[0]
          );

        }


        showMessage(
          "Google Login सफल!",
          "success"
        );


        setTimeout(
          ()=>{

            window.location.href =
              "dashboard.html";

          },
          1000
        );

      }

      catch(error){

        console.error(error);


        showMessage(
          "Google Login नहीं हो पाया।",
          "error"
        );

      }

    }
  );


/* =========================================
   FORGOT PASSWORD
========================================= */

document
  .getElementById(
    "forgotPassword"
  )
  .addEventListener(
    "click",
    async()=>{


      const email =
        document
          .getElementById(
            "loginEmail"
          )
          .value
          .trim();


      if(!email){

        showMessage(
          "पहले अपना Email डालें।",
          "error"
        );

        return;

      }


      try{

        await sendPasswordResetEmail(
          auth,
          email
        );


        showMessage(
          "Password reset link आपके Email पर भेज दिया गया है।",
          "success"
        );

      }

      catch(error){

        console.error(error);


        showMessage(
          "Password reset नहीं हो पाया। Email check करें।",
          "error"
        );

      }

    }
  );

</script>

</body>
</html>
